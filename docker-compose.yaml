  health_service:
    container_name: health_service
    image: ghcr.io/userver-framework/ubuntu-22.04-userver:latest
    command: ["/app/health_service", "--config", "/app/config/health_service_config.yaml"]
    working_dir: /app
    volumes:
      - ./build/health_service:/app/:rw
      - ./health_service/config:/app/config:ro
      - ./health_service/certs:/app/certs:ro
      - ./common/certs:/app/common/certs:ro
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    environment:
      - TZ=Europe/Moscow
      - SERVICES_JSON_PATH=${SERVICES_JSON_PATH}
      - REQUEST_INTERVAL=${REQUEST_INTERVAL}

# ========== Build services

  userver-latest:
    container_name: builder
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile.builder
    restart: "no"
    volumes:
      - ./build:/app/build:rw
    command: bash -c "rm -rf /app/build/* && cp -vfR /app/build_artifacts/* /app/build"

# ========== Database services

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: server_db
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pg-data:
  build-artifacts: