services:
  iot_gateway:
    build:
      context: .
      dockerfile: Dockerfile.builder
    command: ["/app/build/iot_gateway/iot_gateway"]
    volumes:
      - ./iot_gateway/config:/app/config
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      - TZ=Europe/Moscow

  ca_service:
    build:
      context: .
      dockerfile: Dockerfile.builder
    command: ["/app/build/ca_service/ca_service"]
    volumes:
      - ./ca_service/config:/app/config
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
    environment:
      - TZ=Europe/Moscow

  userver-latest:
    build:
      context: .
      dockerfile: Dockerfile.builder
    container_name: userver-app
    restart: "no"
    depends_on: 
      - postgres
      - redis
    volumes:
      - ./:/app

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: server_db
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pg-data: